[project]
name = "lastro"
version = "0.1.0"
description = "Question answering over Brazilian financial regulation, with every answer cited back to the source page."
authors = [
    {name = "Lucas de Oliveira Pimentel",email = "lucasoliveirapimentel.dev@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # ruff's own
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency system is a call in a default argument, which is
# exactly what B008 exists to catch. The pattern is deliberate here.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff (>=0.17.2,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
